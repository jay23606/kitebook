<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
<title id="title">Kitebook: shared knowledge across daily assistants and coding agents</title>
<desc id="desc">Cloud assistants and local coding agents read and write the same durable versioned workspace over HTTPS and MCP. Published files, knowledge and synchronization checkpoints survive client sandbox resets. An optional task path goes through the local runner, which verifies an exact approval or saved signed permission before a coding agent executes in a worktree. The runner connects outbound. Native sessions and credentials remain on the computer unless their context is explicitly shared.</desc>
