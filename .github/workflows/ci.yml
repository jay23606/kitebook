name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_NTFY: '1'
      KITEBOOK_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.3'
      - run: npm ci
      - name: Install browser tools outside the disposable smoke HOME
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/kitebook-playwright" playwright
          echo "PYTHONPATH=$RUNNER_TEMP/kitebook-playwright" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/kitebook-browsers" >> "$GITHUB_ENV"
      - run: python3 -m playwright install --with-deps chromium
      - name: Synthetic local server configuration
        run: |
          umask 077
          echo ADMIN_TOKEN=dev-admin-token > .dev.vars
      - run: npm run typecheck
      - run: bun test client/
      - name: Complete runtime smoke
        run: |
          export SMOKE_PAR_DIR="$RUNNER_TEMP/smoke-logs"
          scripts/smoke-slot.sh -k 2 -- scripts/smoke-par.sh -j 2 --keep || {
            for log in "$SMOKE_PAR_DIR"/run*.log; do
              echo "::group::$log"
              tail -100 "$log"
              echo '::endgroup::'
            done
            exit 1
          }
