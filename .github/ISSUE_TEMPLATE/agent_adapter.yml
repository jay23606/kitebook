name: Connect a coding agent or assistant
description: Ask for (or offer to build) support for another coding agent (runner adapter) or another assistant (connector recipe)
labels: [agents, enhancement]
body:
  - type: markdown
    attributes:
      value: "Adapters are good first PRs: each coding agent is one entry in `client/agent-adapters.ts`, checked against the real CLI's `--help` (see the Codex, Claude Code and opencode entries). Never paste tokens or API keys here."
  - type: dropdown
    id: kind
    attributes:
      label: What kind
      options: [Coding agent on my computer (runner adapter), Assistant that sends tasks (MCP / HTTPS connector), Other]
    validations: { required: true }
  - type: input
    id: name
    attributes: { label: Which one, placeholder: "e.g. Cline, Aider, Amp, Gemini in Android Studio, Le Chat" }
    validations: { required: true }
  - type: textarea
    id: headless
    attributes:
      label: How it runs without a person
      description: "For a coding agent: the headless command (flags for a prompt, a model, auto-approve inside a folder, JSON output, resuming a session) and a link to its CLI docs. For an assistant: does it support remote MCP with OAuth, or only a token?"
    validations: { required: true }
  - type: textarea
    id: safety
    attributes: { label: Safety, description: "What does its auto mode allow (file edits only, shell, network)? Is there a read-only mode Kitebook could use for quick asks?" }
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options: [{ label: "I'd like to build this myself" }]
