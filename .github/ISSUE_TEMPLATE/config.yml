blank_issues_enabled: true
contact_links:
  - name: Before opening a pull request
    url: https://github.com/um1b/kitebook/blob/main/CONTRIBUTING.md
    about: Discuss scope and get maintainer agreement before implementation. Backlog issues are not a call for PRs.
  - name: Security vulnerability
    url: https://github.com/um1b/kitebook/security/advisories/new
    about: Report privately, please. See SECURITY.md.
  - name: Question or setup help
    url: https://github.com/um1b/kitebook/discussions/categories/q-a
    about: How do I connect X, why does my task ask again, is this a bug? Ask in Discussions.
  - name: Idea or show what you built
    url: https://github.com/um1b/kitebook/discussions/categories/ideas
    about: Half-formed ideas, workflows and adapters you built are welcome in Discussions.
