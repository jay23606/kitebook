body:
  - type: textarea
    id: idea
    attributes: { label: The idea, description: "What would you like Kitebook to do, and what's the situation where you'd use it?" }
    validations: { required: true }
  - type: textarea
    id: today
    attributes: { label: What you do today, description: "The workaround, if any." }
  - type: textarea
    id: safety
    attributes: { label: Approval and safety, description: "Would it let an agent do more without your approval, or let the server see more? Kitebook's rule: the server never runs code and never holds agent secrets." }
