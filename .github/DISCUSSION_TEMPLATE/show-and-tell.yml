body:
  - type: textarea
    id: what
    attributes: { label: What you built or automated, description: "An adapter, a connector recipe, a chain, a workflow between an assistant and your coding agents. Screenshots welcome (keep tokens out of frame)." }
    validations: { required: true }
  - type: input
    id: link
    attributes: { label: Link (optional), placeholder: "repo, gist or post" }
